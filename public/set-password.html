<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Set password | Hope, Inc. ERP</title><link rel="stylesheet" href="/register.css"><script src="/auth.js" defer></script></head>
<body><main><p class="brand">HOPE, INC. ERP</p><h1>Set your initial password</h1><p>Choose at least 12 characters with uppercase, lowercase, and a digit. Maximum 72 UTF-8 bytes.</p>
<form id="setPasswordForm">
  <label for="newPassword">New password<input id="newPassword" name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label>
  <label for="confirmPassword">Confirm password<input id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label>
  <button type="submit">Set password</button>
</form><p id="authMessage" role="alert" tabindex="-1"></p><button id="logout" type="button">Sign out</button></main></body></html>
