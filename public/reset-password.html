<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Reset password | Hope, Inc. ERP</title><link rel="stylesheet" href="/register.css"><script src="/password-reset.js" defer></script></head>
<body><main><p class="brand">HOPE, INC. ERP</p><h1>Reset your password</h1><p>Use at least 12 characters with uppercase, lowercase, and a number. Maximum 72 UTF-8 bytes.</p>
<form id="resetPasswordForm"><label for="newPassword">New password<input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label><label for="confirmPassword">Confirm password<input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" maxlength="72" required></label><button type="submit">Reset password</button></form>
<p id="resetMessage" role="status" tabindex="-1"></p><a href="/forgot-password">Request a new reset link</a><p><a href="/login">Back to sign in</a></p></main></body></html>
