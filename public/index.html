<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hope, Inc. ERP — Design System & Components</title>
  <link rel="stylesheet" href="./src/styles/tokens.css">
</head>
<body>
  <div class="app-container">
    <!-- Collapsible Sidebar (Admin / User View Shell) -->
    <aside class="sidebar">
      <div style="padding: 20px; font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid #1E293B;">
        H Hope, Inc. ERP
      </div>
      <nav style="padding: 16px; display: flex; flex-direction: column; gap: 8px;">
        <a href="#" style="color: #F8FAFC; text-decoration: none; padding: 10px; border-radius: 6px; background-color: #1E3A8A;">Dashboard</a>
        <a href="#" style="color: #94A3B8; text-decoration: none; padding: 10px; border-radius: 6px;">Customers</a>
        <a href="#" style="color: #94A3B8; text-decoration: none; padding: 10px; border-radius: 6px;">Products</a>
        <a href="#" style="color: #94A3B8; text-decoration: none; padding: 10px; border-radius: 6px;">Human Resources</a>
        <a href="#" style="color: #94A3B8; text-decoration: none; padding: 10px; border-radius: 6px;">Sales</a>
        <a href="#" style="color: #94A3B8; text-decoration: none; padding: 10px; border-radius: 6px;">User Management</a>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="sticky-header">
        <span>Customer Management</span>
        <span class="badge-active">ADMIN</span>
      </header>

      <div class="content-canvas">
        <!-- Status Tabs Bar -->
        <div class="status-tabs">
          <button class="status-tab active">Active (4)</button>
          <button class="status-tab">Inactive (1)</button>
          <button class="status-tab">All (5)</button>
        </div>

        <!-- Component Showcase Section -->
        <div style="display: flex; gap: 12px; margin-bottom: 24px;">
          <button class="btn btn-primary">+ Add Customer</button>
          <button class="btn btn-secondary">Secondary</button>
          <button class="btn btn-outline">Outline</button>
          <button class="btn btn-danger">Delete</button>
          <button class="btn btn-success">Restore</button>
        </div>

        <!-- Sample Data Table Demonstrating Soft-Deleted Row Styling -->
        <div style="background: white; border: 1px solid var(--color-border); border-radius: 8px; overflow: hidden;">
          <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem;">
            <thead>
              <tr style="background-color: #F1F5F9; color: var(--color-text-secondary); border-bottom: 1px solid var(--color-border);">
                <th style="padding: 12px 16px;">CUST NO</th>
                <th style="padding: 12px 16px;">CUSTOMER NAME</th>
                <th style="padding: 12px 16px;">STATUS</th>
                <th style="padding: 12px 16px;">ACTIONS</th>
              </tr>
            </thead>
            <tbody>
              <tr style="border-bottom: 1px solid var(--color-border);">
                <td style="padding: 12px 16px;">C-001</td>
                <td style="padding: 12px 16px;">Acme Corporation</td>
                <td style="padding: 12px 16px;"><span class="badge-active">Active</span></td>
                <td style="padding: 12px 16px;"><button class="btn btn-outline" style="height: 30px; padding: 0 10px;">Edit</button></td>
              </tr>
              <!-- Soft-Deleted Row following Student Guide Fig. 9, Row 7 -->
              <tr class="row-soft-deleted" style="border-bottom: 1px solid var(--color-border);">
                <td style="padding: 12px 16px;">C-004</td>
                <td style="padding: 12px 16px;">Umbrella Corp (Archived)</td>
                <td style="padding: 12px 16px;"><span class="badge-inactive">Inactive</span></td>
                <td style="padding: 12px 16px;"><button class="btn btn-success" style="height: 30px; padding: 0 10px;">Restore</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
