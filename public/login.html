<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | Hope, Inc. ERP</title><link rel="stylesheet" href="/register.css"><script src="/auth.js" defer></script></head>
<body><main><p class="brand">HOPE, INC. ERP</p><h1>Welcome back</h1><p>Sign in to your account.</p>
<form id="loginForm">
  <label for="email">Email address<input id="email" name="email" type="email" autocomplete="username" maxlength="254" required></label>
  <label for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" maxlength="72"></label>
  <details><summary>First-time account with no password?</summary><p>Enter the private, unexpired setup token supplied by your administrator instead of a password.</p>
  <label for="setupToken">One-time setup token<input id="setupToken" name="setup_token" type="password" autocomplete="off" maxlength="64"></label></details>
  <button type="submit">Sign in</button>
</form><p id="authMessage" role="alert" tabindex="-1"></p><p><a href="/register">Register a new account</a></p></main></body></html>
