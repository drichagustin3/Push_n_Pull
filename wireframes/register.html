<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe - Figure 3: Registration</title>
  <link rel="stylesheet" href="../src/styles/tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #F8FAFC; color: #0F172A; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }

    .auth-card {
      background: #FFFFFF;
      border: 2px solid #CBD5E1;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      padding: 32px;
    }
    .brand-header { text-align: center; margin-bottom: 20px; }
    .logo-box { display: inline-block; background: #1E3A8A; color: #FFFFFF; font-weight: bold; padding: 4px 10px; border-radius: 4px; margin-bottom: 8px; }
    .brand-header h1 { font-size: 1.5rem; color: #0F172A; }
    .brand-header p { font-size: 0.9rem; color: #64748B; margin-top: 4px; }

    /* Role Notice Banner */
    .notice-banner {
      background-color: #EFF6FF;
      border: 1px solid #93C5FD;
      border-left: 4px solid #1E3A8A;
      color: #1E3A8A;
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      line-height: 1.45;
      margin-bottom: 20px;
    }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; color: #1E293B; }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #CBD5E1;
      border-radius: 6px;
      font-size: 0.95rem;
      background: #F8FAFC;
    }

    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: center;
      display: block;
      text-decoration: none;
    }
    .btn-primary { background-color: #1E3A8A; color: #FFFFFF; border: 2px solid #1E3A8A; margin-top: 4px; }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #64748B;
      font-size: 0.85rem;
    }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #CBD5E1; }
    .divider span { padding: 0 10px; }

    .btn-google {
      background-color: #FFFFFF;
      color: #0F172A;
      border: 2px dashed #94A3B8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .google-icon {
      display: inline-block; width: 18px; height: 18px; border: 2px solid #475569;
      border-radius: 50%; font-size: 0.75rem; line-height: 14px; font-weight: bold;
    }

    .footer-link { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #475569; }
    .footer-link a { color: #1E3A8A; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="brand-header">
      <div class="logo-box">H</div>
      <h1>Create an Account</h1>
      <p>Register for Hope, Inc. ERP workspace access</p>
    </div>

    <!-- Required Role Notice Banner -->
    <div class="notice-banner">
      New accounts are created as User. Superadmin and Admin roles can only be assigned by existing administrators.
    </div>

    <form>
      <div class="row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" placeholder="e.g., Ashley">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" placeholder="e.g., Marticio">
        </div>
      </div>

      <div class="form-group">
        <label>Email address</label>
        <input type="email" placeholder="name@hopeinc.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Create a strong password">
      </div>

      <button type="button" class="btn btn-primary">Register</button>
    </form>

    <div class="divider"><span>OR</span></div>

    <button type="button" class="btn btn-google">
      <span class="google-icon">G</span> Continue with Google
    </button>

    <div class="footer-link">
      Already have an account? <a href="login.html">Sign In</a>
    </div>
  </div>

</body>
</html>
